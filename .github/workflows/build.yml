# Builds and tests every push and pull request.
# A tag that looks like v1.2.3 (or v1.2.3-rc1) additionally produces a GitHub
# Release on this repository with:
#   - vtally-<version>-win-x64-portable.exe   the hub as a Windows desktop app
#   - vtally-<version>.tgz                     the hub as an npm package
#   - vtally-<version>-esp8266.zip             firmware + code for the tally lights
#
# Everything is built from this repository alone. There is no S3 bucket, no
# npm account and no separate wrapper repository involved.
name: build
on:
  push:
    branches:
      - '**'
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:

env:
  NODEJS_VERSION: 16
  LUA: "5.1.5"
  # the NodeMCU firmware the tally code is compiled for; luac.cross must match it
  NODEMCU_REPO: nodemcu/nodemcu-firmware
  NODEMCU_FIRMWARE: 3.0-master_20200610
  # the tally and hub never download the Cypress binary; it is only used by cypress.yml
  CYPRESS_INSTALL_BINARY: 0

defaults:
  run:
    shell: bash

jobs:
  # ###
  #
  # Work out the version. Tags are "v1.2.3"; anything else gets a
  # "git describe" name like "v0.5.1-12-gabcdef0".
  #
  # ###
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.calc.outputs.build_name }}
      version: ${{ steps.calc.outputs.version }}
      is_release: ${{ steps.calc.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "git describe" needs the tags
      - id: calc
        run: |
          BUILD_NAME="$(git describe --tags --always)"
          IS_RELEASE="false"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BUILD_NAME="${GITHUB_REF#refs/tags/}"
            IS_RELEASE="true"
          fi
          echo "build_name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${BUILD_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "build_name=${BUILD_NAME} version=${BUILD_NAME#v} is_release=${IS_RELEASE}"

  # ###
  #
  # Hub unit tests
  #
  # ###
  hub-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: sudo apt-get -y update && sudo apt-get install -y libasound2-dev # "midi" builds against ALSA
      - run: npm ci
      - run: npm run test:ci

  # ###
  #
  # luac.cross compiles the Lua files to bytecode that matches the firmware
  #
  # ###
  luaccross:
    runs-on: ubuntu-22.04
    steps:
      - name: Cache luac.cross
        id: cache
        uses: actions/cache@v4
        with:
          path: ./luac.cross
          key: ${{ runner.os }}-luaccross-${{ env.NODEMCU_REPO }}-${{ env.NODEMCU_FIRMWARE }}
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ env.NODEMCU_REPO }}
          ref: ${{ env.NODEMCU_FIRMWARE }}
          submodules: recursive
      - run: make -C ./app/lua/luac_cross/
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: luaccross
          path: ./luac.cross
          if-no-files-found: error
          retention-days: 1

  # ###
  #
  # Test and compile the code that runs on the tally light
  #
  # ###
  tally-build:
    runs-on: ubuntu-latest
    needs: luaccross
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ env.LUA }}
      - uses: leafo/gh-actions-luarocks@v4
      - uses: actions/download-artifact@v4
        with:
          name: luaccross
          path: /tmp
      - run: |
          sudo mv /tmp/luac.cross /usr/local/bin
          sudo chmod a+x /usr/local/bin/luac.cross
          luarocks install busted
      - run: make test
        working-directory: ./tally
      - run: make build
        working-directory: ./tally
      - uses: actions/upload-artifact@v4
        with:
          name: tally-dist
          path: ./tally/out
          if-no-files-found: error
          retention-days: 1

  # ###
  #
  # Zip firmware + compiled tally code: what the hub's flasher writes to a NodeMCU
  #
  # ###
  esp8266:
    runs-on: ubuntu-latest
    needs:
      - setup
      - tally-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tally-dist
          path: esp8266
      - run: cp firmware/prebuilt/nodemcu-*.bin esp8266/
      - run: zip -Jrq "../vtally-${{ needs.setup.outputs.version }}-esp8266.zip" *
        working-directory: esp8266
      - uses: actions/upload-artifact@v4
        with:
          name: esp8266
          path: vtally-*-esp8266.zip
          if-no-files-found: error
          retention-days: 1

  # ###
  #
  # Package the hub as an npm tarball (what the Electron wrapper installs)
  #
  # ###
  hub-package:
    runs-on: ubuntu-latest
    needs:
      - setup
      - hub-test
      - tally-build
    env:
      BUILD_NAME: ${{ needs.setup.outputs.build_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: sudo apt-get -y update && sudo apt-get install -y libasound2-dev
      - run: npm ci
        working-directory: hub
      - run: ./scripts/build.sh
        working-directory: hub
      - uses: actions/download-artifact@v4
        with:
          name: tally-dist
          path: hub/dist/esp8266
      - run: cp firmware/prebuilt/nodemcu-*.bin hub/dist/esp8266/
      - run: cp Readme.md LICENSE Changelog.md hub/dist/
      - run: |
          npm shrinkwrap
          npm pack
        working-directory: hub/dist
      - uses: actions/upload-artifact@v4
        with:
          name: hub-package
          path: hub/dist/vtally-*.tgz
          if-no-files-found: error
          retention-days: 1

  # ###
  #
  # The Windows desktop app. Built on Windows because the hub's native modules
  # (midi, serialport) are compiled for the host.
  #
  # ###
  electron-windows:
    # not windows-latest: it ships Visual Studio 2026, which the node-gyp that
    # compiles the hub's midi/serialport modules does not recognise yet
    runs-on: windows-2022
    needs:
      - setup
      - hub-package
    defaults:
      run:
        # a job-level "defaults.run" replaces the workflow-level one, so the
        # shell has to be repeated here or the steps run under PowerShell
        shell: bash
        working-directory: ./electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: hub-package
          path: electron/hub-package
      - run: npm install --no-audit --no-fund
      - run: node scripts/prepare.js hub-package/vtally-*.tgz
      - run: ./node_modules/.bin/electron-rebuild
      - run: npm run dist -- --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: electron/dist/vtally-*-portable.exe
          if-no-files-found: error
          retention-days: 1

  # ###
  #
  # On a version tag: publish everything as a GitHub Release (draft, so the
  # notes can be checked before it goes live)
  #
  # ###
  release:
    runs-on: ubuntu-latest
    if: needs.setup.outputs.is_release == 'true'
    needs:
      - setup
      - esp8266
      - hub-package
      - electron-windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -l artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.setup.outputs.build_name }}
          draft: true
          prerelease: ${{ contains(needs.setup.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/vtally-*-portable.exe
            artifacts/vtally-*.tgz
            artifacts/vtally-*-esp8266.zip
