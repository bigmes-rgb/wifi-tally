
appId: org.acc.tally
artifactName: acc-tally-${version}-${os}-${arch}.${ext}
productName: ACC Tally
linux: 
  target: appImage
  executableName: acc-tally
  category: AudioVideo
win: 
  target: portable
  icon: build/icons/icon.png
  artifactName: acc-tally-${version}-${os}-${arch}-portable.${ext}
# The portable exe unpacks itself to %TEMP%\<this name> on every start. A fixed name keeps the
# path the same across versions, so Windows Firewall's "allow" for ACC Tally (needed for the lights'
# UDP packets) still applies after an update instead of asking again or silently blocking.
portable:
  # kept from the vTally days on purpose: renaming it would make Windows Firewall ask again
  unpackDirName: vtally-hub
mac:
  target: dmg
  category: public.app-category.video
  icon: build/icons/icon.png
extraResources:
  - "./assets/**"