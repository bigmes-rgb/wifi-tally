
appId: org.acc.tally
artifactName: acc-tally-${version}-${os}-${arch}.${ext}
productName: ACC Tally
linux: 
  target: appImage
  executableName: acc-tally
  category: AudioVideo
win: 
  # an installer, so the app can update itself (electron/src/updates.js); the portable exe could not
  target: nsis
  icon: build/icons/icon.png
nsis:
  # one click, for this Windows user only: no administrator needed, neither for the install nor for the updates
  # that follow. It goes to %LOCALAPPDATA%\Programs and keeps that path across updates, so Windows Firewall's
  # "allow" for ACC Tally is asked once and then stays.
  oneClick: true
  perMachine: false
  artifactName: acc-tally-${version}-setup.${ext}
  shortcutName: ACC Tally
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
# where the installed app looks for a newer version: this repository's GitHub releases. The build itself never
# publishes (npm run dist passes --publish never); the workflow's release step uploads the installer together with
# latest.yml, which is what the app reads.
publish:
  - provider: github
    owner: bigmes-rgb
    repo: wifi-tally
mac:
  target: dmg
  category: public.app-category.video
  icon: build/icons/icon.png
extraResources:
  - "./assets/**"
